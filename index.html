<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101114">
  <title>ZftOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="os" aria-label="ZftOS">
    <div class="wallpaper"></div>
    <header class="status-bar">
      <span id="clock">12:00</span>
      <div class="status-icons"><span>▴</span><span>Wi‑Fi</span><span>▮▮▮</span><span>100%</span></div>
    </header>

    <section class="desktop" id="desktop">
      <div class="app-grid" id="appGrid">
        <button class="app-icon" data-app="Files"><span class="icon files">▱</span><b>Files</b></button>
        <button class="app-icon" data-app="Browser"><span class="icon browser">◉</span><b>Browser</b></button>
        <button class="app-icon" data-app="Gallery"><span class="icon gallery">▣</span><b>Gallery</b></button>
        <button class="app-icon" data-app="Settings"><span class="icon settings">⚙</span><b>Settings</b></button>
        <button class="app-icon" data-app="Terminal"><span class="icon terminal">&gt;_</span><b>Terminal</b></button>
        <button class="app-icon" data-app="Store"><span class="icon store">◆</span><b>Store</b></button>
        <button class="app-icon" data-app="Messages"><span class="icon messages">•••</span><b>Messages</b></button>
        <button class="app-icon" data-app="Music"><span class="icon music">♫</span><b>Music</b></button>
      </div>
    </section>

    <nav class="dock" aria-label="Dock">
      <button class="dock-icon" data-app="Phone">☎</button>
      <button class="dock-icon" data-app="Messages">•••</button>
      <button class="dock-icon" data-app="Browser">◉</button>
      <button class="dock-icon" data-app="Camera">●</button>
      <button class="dock-icon" data-app="Settings">⚙</button>
    </nav>

    <div class="toast" id="toast"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
