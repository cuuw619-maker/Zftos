<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>ZftOS — Floating Stack</title>
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <main id="simulation" aria-label="Floating Stack simulation">
    <div class="background"></div>
    <div class="screen-layer" id="screenLayer"></div>
    <div class="screen-title" id="screenTitle">Главная</div>

    <div class="floating-stack" id="floatingStack">
      <div class="glass" aria-hidden="true"></div>
      <div class="shine" aria-hidden="true"></div>
      <div class="selection" id="selection" aria-hidden="true"></div>
      <div class="items" id="items"></div>
    </div>

    <div class="hint" id="hint">Зажмите и проведите</div>
  </main>
  <script type="module" src="src/core/app.js"></script>
</body>
</html>
