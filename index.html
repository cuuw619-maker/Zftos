<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050507">
  <title>ZftOS</title>
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <div class="phone-shell" aria-label="ZftOS mobile device">
    <div class="phone-frame">
      <main id="os" aria-label="ZftOS">
        <div class="wallpaper"></div>
        <header class="status-bar">
          <span id="clock">12:00</span>
          <div class="status-icons" aria-label="Состояние устройства">
            <span class="signal-icon" aria-label="Сеть"><i></i><i></i><i></i><i></i></span>
            <span class="wifi-icon" aria-label="Wi-Fi"></span>
            <span class="battery" aria-label="Батарея 100%"><span class="battery-level"></span></span>
            <span class="battery-percent">100%</span>
          </div>
        </header>

        <section class="desktop" id="desktop" aria-label="Рабочий стол">
          <div class="pages" id="pages"></div>
          <div class="page-dots" id="pageDots" aria-label="Страницы рабочего стола"></div>
        </section>

        <nav class="dock" id="dock" aria-label="Dock"></nav>
        <div class="home-indicator" aria-hidden="true"></div>

        <section class="app-window" id="appWindow" aria-hidden="true">
          <div class="app-window-bg"></div>
          <img class="launch-image" id="launchImage" alt="" aria-hidden="true">
          <header class="app-window-bar">
            <button class="app-back" id="appBack" type="button" aria-label="Назад">‹</button>
            <div class="app-window-title" id="appWindowTitle"></div>
          </header>
          <div class="app-placeholder" id="appPlaceholder">
            <div class="placeholder-icon" id="placeholderIcon"></div>
            <h2 id="placeholderName"></h2>
            <p>Интерфейс приложения — заглушка</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="src/core/app.js"></script>
</body>
</html>
